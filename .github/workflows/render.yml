name: AI Shorts Generator

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    # Never allow a stuck video generation to run for hours
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate AI Video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "===== START VIDEO GENERATION ====="
          python -u generate_video.py
          echo "===== VIDEO GENERATION FINISHED ====="

      - name: Show Generated Files
        if: always()
        run: |
          echo "===== FILES ====="
          pwd
          find . -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Upload Final Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          if-no-files-found: warn
          path: |
            final.mp4
            voice.mp3
            merged.mp4
            clips/*.mp4